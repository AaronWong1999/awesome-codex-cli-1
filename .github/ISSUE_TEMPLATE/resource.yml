name: Submit a resource
description: Suggest a Codex resource for review. Do not open a pull request.
title: "[Resource] "
labels: [resource-submission, validation-pending]
body:
  - type: markdown
    attributes:
      value: |
        Submit one resource per issue. An automated check validates the form and posts the result as a comment; a maintainer then reviews at their discretion.

        Eligible resources are free and open, work with Codex CLI, and have 100+ GitHub stars. Resources below that are reviewed on distinctiveness and quality; explain why in the description. See contributing.md for details.
  - type: input
    id: display_name
    attributes:
      label: Display Name
      description: The name of the resource as it will appear in the list.
      placeholder: "e.g., codex-monitor"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: The README section the resource belongs in.
      options:
        - "GUI & Apps"
        - "Mobile & Remote Access"
        - "Session Managers"
        - "Agent Runtimes & Orchestration"
        - "Sandboxes"
        - "Account Switchers & Proxies"
        - "Usage & Monitoring"
        - "Setup & Config Management"
        - "Forks & Patched Builds"
        - "Code Quality & Review"
        - "Claude Code Interop"
        - "Terminal"
        - "Plugins"
        - "Prompts & Templates"
        - "Testing & Evaluation"
        - "Agent Skills > General"
        - "Agent Skills > Domain-Specific"
        - "MCP Servers > Management"
        - "MCP Servers > Memory & Context"
        - "MCP Servers > Utilities"
        - "Directories & Registries"
        - "Workflows & Knowledge Guides"
        - "Documentation"
        - "Blog Posts & Tutorials"
        - "IDE Integrations"
        - "Community Projects"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: The main URL (must start with https://). Prefer the GitHub repo.
      placeholder: "https://github.com/username/repository"
    validations:
      required: true
  - type: input
    id: author_name
    attributes:
      label: Author Name
      description: The author's name, alias, or GitHub username.
      placeholder: "Jane Doe or janedoe"
    validations:
      required: true
  - type: input
    id: author_link
    attributes:
      label: Author Link
      description: Link to the author's GitHub profile or website (https://).
      placeholder: "https://github.com/janedoe"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "1-3 neutral sentences on what it does and how it works with Codex. No marketing, don't address the reader. (10-500 characters.)"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "I checked the README and existing issues, and this resource is distinct from existing entries."
          required: true
        - label: "All links are working and publicly accessible."
          required: true
        - label: "This resource is free and open, and works with Codex CLI as described."
          required: true
        - label: "I have read contributing.md."
          required: true
        - label: "Do not check the following box - leave it unchecked. By checking this box, I admit that I am not reading any of these statements."
          required: false
